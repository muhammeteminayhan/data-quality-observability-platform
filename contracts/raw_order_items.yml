# ===========================================================================
# Contract: raw.order_items
# ===========================================================================
dataset: raw.order_items
version: "1.0.0"
owner: data-platform
criticality: critical
layer: raw
description: >
  Order line items. The highest-volume table and the one that carries the
  line-level arithmetic identity.

source:
  type: postgres
  location: raw.order_items
  # Line items have no business event time of their own, so freshness is
  # measured from ingestion. Recorded explicitly rather than pretending an
  # event time exists.
  ingestion_timestamp_column: _ingested_at

freshness:
  enabled: true
  warning_after_minutes: 180
  critical_after_minutes: 720
  on_missing_timestamp: CRITICAL

volume:
  enabled: true
  min_rows: 1000
  max_rows: 5000000
  severity: ERROR
  baseline:
    method: rolling_median_mad
    window_days: 28
    min_history_points: 5
    warning_z: 3.5
    critical_z: 6.0
    same_day_type: true

schema:
  enforce: true
  on_additive: INFO
  on_type_change: CRITICAL
  on_column_removal: CRITICAL
  on_rename_candidate: ERROR
  columns:
    - name: ingestion_id
      type: bigint
      nullable: false
    - name: order_item_id
      type: text
      nullable: false
    - name: order_id
      type: text
      nullable: false
    - name: product_id
      type: text
      nullable: false
    - name: seller_id
      type: text
    - name: item_sequence
      type: integer
    - name: quantity
      type: integer
      nullable: false
    - name: unit_price
      type: numeric
      nullable: false
    - name: discount
      type: numeric
    - name: line_total
      type: numeric
      nullable: false
    - name: shipping_limit_date
      type: timestamp with time zone
    - name: _ingested_at
      type: timestamp with time zone
      nullable: false
    - name: _batch_id
      type: text
      nullable: false
    - name: _source
      type: text
      nullable: false

distribution:
  enabled: true
  min_sample_size: 1000
  severity: WARNING
  numeric:
    - column: unit_price
      method: psi
      bins: 10
      warning: 0.10
      critical: 0.25
    - column: quantity
      method: psi
      bins: 5
      warning: 0.15
      critical: 0.30

quality_rules:
  - name: order_item_id_not_null
    dimension: completeness
    severity: CRITICAL
    expectation: expect_column_values_to_not_be_null
    column: order_item_id

  - name: order_id_not_null
    dimension: completeness
    severity: CRITICAL
    expectation: expect_column_values_to_not_be_null
    column: order_id

  - name: line_total_not_null
    dimension: completeness
    severity: CRITICAL
    expectation: expect_column_values_to_not_be_null
    column: line_total

  - name: order_item_id_unique
    dimension: uniqueness
    severity: ERROR
    expectation: expect_column_values_to_be_unique
    column: order_item_id

  - name: quantity_is_positive
    dimension: validity
    severity: ERROR
    expectation: expect_column_values_to_be_between
    column: quantity
    kwargs:
      min_value: 1
      max_value: 1000

  - name: unit_price_is_positive
    dimension: validity
    severity: ERROR
    expectation: expect_column_values_to_be_between
    column: unit_price
    kwargs:
      min_value: 0.01
      max_value: 100000

  - name: every_item_has_a_known_order
    dimension: consistency
    severity: CRITICAL
    description: Referential integrity against raw.orders.
    expectation: unexpected_rows
    sql: |
      SELECT i.order_item_id, i.order_id
      FROM {batch} i
      LEFT JOIN raw.orders o ON o.order_id = i.order_id
      WHERE i.order_id IS NOT NULL AND o.order_id IS NULL

  - name: every_item_has_a_known_product
    dimension: consistency
    severity: CRITICAL
    description: Referential integrity against raw.products.
    expectation: unexpected_rows
    sql: |
      SELECT i.order_item_id, i.product_id
      FROM {batch} i
      LEFT JOIN raw.products p ON p.product_id = i.product_id
      WHERE i.product_id IS NOT NULL AND p.product_id IS NULL

  - name: line_total_equals_quantity_times_price_minus_discount
    dimension: consistency
    severity: ERROR
    description: >
      The line-level arithmetic identity, with a two-cent tolerance because
      each component is rounded to cents independently.
    expectation: unexpected_rows
    sql: |
      SELECT order_item_id, quantity, unit_price, discount, line_total
      FROM {batch}
      WHERE line_total IS NOT NULL
        AND quantity IS NOT NULL
        AND unit_price IS NOT NULL
        AND abs(line_total - (quantity * unit_price - COALESCE(discount, 0))) > 0.02

  - name: discount_not_above_gross
    dimension: consistency
    severity: WARNING
    expectation: unexpected_rows
    sql: |
      SELECT order_item_id, quantity, unit_price, discount
      FROM {batch}
      WHERE discount IS NOT NULL
        AND quantity IS NOT NULL
        AND unit_price IS NOT NULL
        AND discount > quantity * unit_price

score:
  weights:
    completeness: 0.25
    uniqueness: 0.15
    validity: 0.15
    consistency: 0.25
    freshness: 0.10
    volume: 0.10
  healthy_at: 95.0
  degraded_at: 75.0
