# ===========================================================================
# Contract: raw.payments
# ===========================================================================
dataset: raw.payments
version: "1.0.0"
owner: data-platform
criticality: critical
layer: raw
description: >
  Payment rows. A refund is a legitimate NEGATIVE payment_value, so there is
  deliberately no "payment_value must be positive" rule: that rule would fire
  on correct data.

source:
  type: postgres
  location: raw.payments
  event_timestamp_column: payment_date
  ingestion_timestamp_column: _ingested_at

freshness:
  enabled: true
  warning_after_minutes: 180
  critical_after_minutes: 720
  on_missing_timestamp: CRITICAL

volume:
  enabled: true
  min_rows: 1000
  max_rows: 3000000
  severity: ERROR
  baseline:
    method: rolling_median_mad
    window_days: 28
    min_history_points: 5
    warning_z: 3.5
    critical_z: 6.0
    same_day_type: true

schema:
  enforce: true
  on_additive: INFO
  on_type_change: CRITICAL
  on_column_removal: CRITICAL
  on_rename_candidate: ERROR
  columns:
    - name: ingestion_id
      type: bigint
      nullable: false
    - name: payment_id
      type: text
      nullable: false
    - name: order_id
      type: text
      nullable: false
    - name: payment_type
      type: text
      nullable: false
    - name: payment_sequence
      type: integer
    - name: payment_installments
      type: integer
    - name: payment_value
      type: numeric
      nullable: false
    - name: payment_date
      type: timestamp with time zone
    - name: _ingested_at
      type: timestamp with time zone
      nullable: false
    - name: _batch_id
      type: text
      nullable: false
    - name: _source
      type: text
      nullable: false

distribution:
  enabled: true
  min_sample_size: 1000
  severity: WARNING
  numeric:
    - column: payment_value
      method: psi
      bins: 10
      warning: 0.10
      critical: 0.25
  categorical:
    - column: payment_type
      method: chi_square
      alpha: 0.01
      min_expected_frequency: 5

quality_rules:
  - name: payment_id_not_null
    dimension: completeness
    severity: CRITICAL
    expectation: expect_column_values_to_not_be_null
    column: payment_id

  - name: order_id_not_null
    dimension: completeness
    severity: CRITICAL
    expectation: expect_column_values_to_not_be_null
    column: order_id

  - name: payment_value_not_null
    dimension: completeness
    severity: CRITICAL
    expectation: expect_column_values_to_not_be_null
    column: payment_value

  - name: payment_id_unique
    dimension: uniqueness
    severity: ERROR
    expectation: expect_column_values_to_be_unique
    column: payment_id

  - name: payment_type_in_accepted_set
    dimension: validity
    severity: ERROR
    expectation: expect_column_values_to_be_in_set
    column: payment_type
    kwargs:
      value_set: [credit_card, debit_card, bank_transfer, voucher, wallet, refund]

  - name: payment_value_within_plausible_range
    dimension: validity
    severity: ERROR
    description: >
      The lower bound is negative on purpose: refunds are negative and are
      correct. The range only rejects values no real transaction would have.
    expectation: expect_column_values_to_be_between
    column: payment_value
    kwargs:
      min_value: -1000000
      max_value: 1000000

  - name: every_payment_has_a_known_order
    dimension: consistency
    severity: CRITICAL
    description: Referential integrity against raw.orders.
    expectation: unexpected_rows
    sql: |
      SELECT p.payment_id, p.order_id
      FROM {batch} p
      LEFT JOIN raw.orders o ON o.order_id = p.order_id
      WHERE p.order_id IS NOT NULL AND o.order_id IS NULL

  - name: refunds_are_negative
    dimension: consistency
    severity: ERROR
    description: >
      A row typed as a refund must reduce the balance. A positive refund is a
      sign-handling bug upstream.
    expectation: unexpected_rows
    sql: |
      SELECT payment_id, payment_value
      FROM {batch}
      WHERE payment_type = 'refund' AND payment_value >= 0

  - name: settling_payments_are_positive
    dimension: consistency
    severity: ERROR
    expectation: unexpected_rows
    sql: |
      SELECT payment_id, payment_type, payment_value
      FROM {batch}
      WHERE payment_type <> 'refund' AND payment_value <= 0

score:
  weights:
    completeness: 0.25
    uniqueness: 0.15
    validity: 0.20
    consistency: 0.20
    freshness: 0.10
    volume: 0.10
  healthy_at: 95.0
  degraded_at: 75.0
