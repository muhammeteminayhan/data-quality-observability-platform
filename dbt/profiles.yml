# ===========================================================================
# dbt profile
# ===========================================================================
# Credentials come from the environment, never from this file. The same
# variables docker-compose passes to the platform services are reused, so
# there is one place to change a password.
# ===========================================================================
commerce_dq:
  target: local
  outputs:
    local:
      type: postgres
      host: "{{ env_var('SOURCE_POSTGRES_HOST') }}"
      port: "{{ env_var('SOURCE_POSTGRES_PORT', '5432') | int }}"
      user: "{{ env_var('SOURCE_POSTGRES_USER') }}"
      password: "{{ env_var('SOURCE_POSTGRES_PASSWORD') }}"
      dbname: "{{ env_var('SOURCE_POSTGRES_DB') }}"
      # dbt prepends the target schema to a model's custom schema unless a
      # generate_schema_name macro says otherwise; macros/get_custom_schema.sql
      # makes `staging` mean `staging`, not `public_staging`.
      schema: public
      threads: 4
      keepalives_idle: 0
      connect_timeout: 10
      retries: 2
