# ===========================================================================
# Prometheus scrape configuration
# ===========================================================================
# Read by the `prometheus` service at /etc/prometheus/prometheus.yml.
#
# Prometheus is used for the operational, low-cardinality view: is the
# platform running, how long do checks take, how many failures per dataset.
# Business-level history (per-run scores, per-rule results, incident
# timelines) is kept in observability_db instead - see
# sql/platform/10_observability_schema.sql, table metric_history - because
# Prometheus is a sampling store with a short retention and a per-series
# cardinality budget.
#
# Label discipline: the exporter never labels a series with a customer id,
# order id, run id or an unbounded error string. See src/metrics/exporter.py.
# ===========================================================================

global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
  external_labels:
    platform: data-quality-observability
    environment: local

scrape_configs:
  # -----------------------------------------------------------------------
  # The platform's own data-quality exporter.
  # -----------------------------------------------------------------------
  - job_name: dq-exporter
    metrics_path: /metrics
    static_configs:
      - targets: ["dq-exporter:9091"]
        labels:
          component: data-quality

  # -----------------------------------------------------------------------
  # The read API exposes its own process metrics on the same path.
  # -----------------------------------------------------------------------
  - job_name: dq-api
    metrics_path: /metrics
    static_configs:
      - targets: ["dq-api:8000"]
        labels:
          component: api

  # -----------------------------------------------------------------------
  # Alert webhook receiver - proves alert delivery is actually happening.
  # -----------------------------------------------------------------------
  - job_name: alert-webhook
    metrics_path: /metrics
    static_configs:
      - targets: ["alert-webhook:8000"]
        labels:
          component: alerting

  # -----------------------------------------------------------------------
  # Prometheus scraping itself, so a gap in the data can be told apart from
  # a genuine zero.
  # -----------------------------------------------------------------------
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
        labels:
          component: monitoring
